<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인터벌">
<title>인터벌 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: 한 손으로 쓰는 세로 한 줄. 설정 화면은 차분한 종이색,
     운동 화면은 구간 색이 화면 전체를 채워 멀리서도 지금 구간이 보인다. */
  :root {
    --bg: #f2f4f1;
    --surface: #ffffff;
    --ink: #16201f;
    --muted: #5a6866;
    --line: #d8ddd8;
    --accent: #c93a26;
    --on-accent: #ffffff;
    --work: #c93a26;
    --rest: #0f7f78;
    --prep: #a86400;
    --setrest: #2f6690;
    --cool: #4a56b0;
    --display: "Barlow Condensed", "Arial Narrow", "Apple SD Gothic Neo", sans-serif;
    --body: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121716;
      --surface: #1c2322;
      --ink: #eef1ee;
      --muted: #9ba8a5;
      --line: #2d3735;
      --accent: #e9634b;
      --on-accent: #1a0d0a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121716;
    --surface: #1c2322;
    --ink: #eef1ee;
    --muted: #9ba8a5;
    --line: #2d3735;
    --accent: #e9634b;
    --on-accent: #1a0d0a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    transition: background-color 0.35s ease;
  }
  main { height: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--setrest); outline-offset: 2px; }

  .view {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ===== 설정 화면 ===== */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--body); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .toggle {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 14px;
    color: var(--muted);
  }
  .toggle[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }

  h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
  .block { display: flex; flex-direction: column; gap: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .chip > button { padding: 9px 12px; }
  .chip > .del { padding: 9px 10px 9px 2px; color: var(--muted); }
  .chip.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .chip.on > .del { color: inherit; opacity: 0.7; }

  .rows {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 10px 10px 14px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row-label { display: flex; align-items: center; gap: 10px; font-weight: 500; min-width: 0; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--line); }
  .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
  .step-btn {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--bg);
    font-size: 22px;
    line-height: 1;
    user-select: none; -webkit-user-select: none;
  }
  .step-btn:active { background: var(--line); }
  .step-val {
    min-width: 84px;
    text-align: center;
    font-family: var(--display);
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .step-val.off { color: var(--muted); font-family: var(--body); font-size: 15px; font-weight: 500; }

  .plan {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .plan-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .plan-total { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .plan-sub { font-size: 14px; color: var(--muted); }

  .timeline { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--line); }
  .timeline.gap { gap: 1px; }
  .seg { min-width: 0; flex-basis: 0; }
  .seg.work { background: var(--work); }
  .seg.rest { background: var(--rest); }
  .seg.prep { background: var(--prep); }
  .seg.setrest { background: var(--setrest); }
  .seg.cool { background: var(--cool); }

  .primary {
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 12px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    width: 100%;
  }
  .primary:active { filter: brightness(0.92); }
  .ghost {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 12px;
    padding: 14px;
    font-weight: 500;
    width: 100%;
  }

  .save-row { display: flex; gap: 8px; }
  .save-row input {
    flex: 1; min-width: 0;
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .save-row button {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 500;
    flex: none;
  }

  .log { list-style: none; display: flex; flex-direction: column; }
  .log li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .log .when { color: var(--muted); }
  .log .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { font-size: 14px; color: var(--muted); }

  /* ===== 운동 화면 ===== */
  body[data-view="run"] { background: var(--phase, var(--work)); color: #fff; }
  body[data-phase="work"] { --phase: var(--work); }
  body[data-phase="rest"] { --phase: var(--rest); }
  body[data-phase="prep"] { --phase: var(--prep); }
  body[data-phase="setrest"] { --phase: var(--setrest); }
  body[data-phase="cool"] { --phase: var(--cool); }

  #viewRun { height: 100%; justify-content: space-between; align-items: stretch; text-align: center; gap: 12px; }
  .run-top { display: flex; flex-direction: column; gap: 2px; }
  .phase-name { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .run-pos { font-size: 17px; opacity: 0.9; font-variant-numeric: tabular-nums; }

  .ring-wrap { position: relative; width: min(78vw, 46vh, 340px); aspect-ratio: 1; margin: 0 auto; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.22); stroke-width: 10; }
  .ring-fg { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
  .clock {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: min(34vw, 20vh, 150px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .clock.long { font-size: min(25vw, 15vh, 110px); }
  .paused .clock { opacity: 0.55; }

  .run-next { font-size: 17px; opacity: 0.92; }
  .run-left { font-size: 14px; opacity: 0.8; font-variant-numeric: tabular-nums; }
  .run-info { display: flex; flex-direction: column; gap: 10px; }
  #viewRun .timeline { background: rgba(255,255,255,0.2); height: 10px; }
  #viewRun .seg { background: rgba(255,255,255,0.3); }
  #viewRun .seg.done { background: rgba(255,255,255,0.85); }
  #viewRun .seg.now { background: #fff; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .ctl {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }
  .ctl:active { background: rgba(255,255,255,0.35); }
  .ctl.main { width: 92px; height: 92px; background: #fff; color: var(--phase, var(--work)); font-size: 17px; }
  .ctl:focus-visible, .stop:focus-visible { outline-color: #fff; }
  .stop { color: #fff; font-weight: 600; padding: 10px; text-decoration: underline; text-underline-offset: 4px; min-height: 44px; }
  .stop-slot { min-height: 44px; }

  /* ===== 완료 화면 ===== */
  .done-title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px; text-align: center; }
  .stat b { display: block; font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    body, .ring-fg { transition: none; }
  }
</style>
</head>
<body data-view="setup">

<main>
  <!-- 설정 -->
  <section class="view" id="viewSetup">
    <div class="head">
      <h1>인터벌 트레이너</h1>
      <button type="button" class="toggle" id="soundBtn" aria-pressed="true">소리 켜짐</button>
    </div>

    <div class="block">
      <h2>루틴</h2>
      <div class="chips" id="presets"></div>
    </div>

    <div class="rows" id="rows"></div>

    <div class="plan">
      <div class="plan-top">
        <div class="plan-total" id="planTotal">0:00</div>
        <div class="plan-sub" id="planSub"></div>
      </div>
      <div class="timeline" id="planLine" aria-hidden="true"></div>
      <button type="button" class="primary" id="startBtn">운동 시작</button>
    </div>

    <div class="block">
      <h2>지금 설정을 내 루틴으로 저장</h2>
      <form class="save-row" id="saveForm">
        <input type="text" id="presetName" maxlength="12" placeholder="루틴 이름" autocomplete="off" aria-label="루틴 이름">
        <button type="submit">저장</button>
      </form>
    </div>

    <div class="block">
      <h2>최근 기록</h2>
      <ul class="log" id="log"></ul>
      <p class="empty" id="logEmpty">아직 기록이 없습니다. 운동을 마치면 여기에 쌓입니다.</p>
    </div>
  </section>

  <!-- 운동 -->
  <section class="view" id="viewRun" hidden>
    <div class="run-top">
      <div class="phase-name" id="phaseName" aria-live="polite">운동</div>
      <div class="run-pos" id="runPos"></div>
    </div>

    <div class="ring-wrap" id="ringWrap">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <circle class="ring-bg" cx="150" cy="150" r="140"></circle>
        <circle class="ring-fg" id="ring" cx="150" cy="150" r="140" stroke-dasharray="879.65" stroke-dashoffset="0"></circle>
      </svg>
      <div class="clock" id="clock" role="timer">30</div>
    </div>

    <div class="run-info">
      <div class="run-next" id="runNext"></div>
      <div class="timeline" id="runLine" aria-hidden="true"></div>
      <div class="run-left" id="runLeft"></div>
    </div>

    <div>
      <div class="controls">
        <button type="button" class="ctl" id="prevBtn" aria-label="이전 구간">이전</button>
        <button type="button" class="ctl main" id="pauseBtn">일시정지</button>
        <button type="button" class="ctl" id="nextBtn" aria-label="다음 구간">다음</button>
      </div>
      <div class="stop-slot">
        <button type="button" class="stop" id="stopBtn" hidden>운동 끝내기</button>
      </div>
    </div>
  </section>

  <!-- 완료 -->
  <section class="view" id="viewDone" hidden>
    <div class="done-title" id="doneTitle">운동 완료</div>
    <div class="stats">
      <div class="stat"><b id="doneTotal">0:00</b><span>전체 시간</span></div>
      <div class="stat"><b id="doneWork">0:00</b><span>운동 시간</span></div>
      <div class="stat"><b id="doneRounds">0</b><span>완료 라운드</span></div>
    </div>
    <button type="button" class="primary" id="againBtn">같은 루틴 다시 하기</button>
    <button type="button" class="ghost" id="backBtn">설정으로 돌아가기</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  // ===== 설정 항목 =====
  var FIELDS = [
    { k: 'prep',    label: '준비',           time: true,  min: 0, max: 300,  phase: 'prep' },
    { k: 'work',    label: '운동',           time: true,  min: 5, max: 1800, phase: 'work' },
    { k: 'rest',    label: '휴식',           time: true,  min: 0, max: 1800, phase: 'rest' },
    { k: 'rounds',  label: '라운드',         time: false, min: 1, max: 50,   unit: '회' },
    { k: 'sets',    label: '세트',           time: false, min: 1, max: 10,   unit: '세트' },
    { k: 'setRest', label: '세트 사이 휴식', time: true,  min: 0, max: 1800, phase: 'setrest' },
    { k: 'cool',    label: '마무리 운동',    time: true,  min: 0, max: 1800, phase: 'cool' }
  ];
  var PHASE_NAME = { prep: '준비', work: '운동', rest: '휴식', setrest: '세트 휴식', cool: '마무리 운동' };

  var BUILTIN = [
    { name: '타바타',      cfg: { prep: 10, work: 20, rest: 10, rounds: 8,  sets: 1, setRest: 60, cool: 0 } },
    { name: 'HIIT 30/30',  cfg: { prep: 10, work: 30, rest: 30, rounds: 10, sets: 1, setRest: 60, cool: 0 } },
    { name: '서킷 3세트',  cfg: { prep: 10, work: 40, rest: 20, rounds: 5,  sets: 3, setRest: 90, cool: 0 } },
    { name: '러닝 인터벌', cfg: { prep: 10, work: 60, rest: 120, rounds: 6, sets: 1, setRest: 60, cool: 300 } }
  ];

  // ===== 저장소 (없어도 동작) =====
  function load(key, fallback) {
    try { var v = localStorage.getItem('intervalTrainer.' + key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem('intervalTrainer.' + key, JSON.stringify(value)); } catch (e) {}
  }

  var cfg = sanitize(load('cfg', BUILTIN[0].cfg));
  var myPresets = load('presets', []);
  var log = load('log', []);
  var soundOn = load('sound', true);

  function sanitize(c) {
    var out = {};
    FIELDS.forEach(function (f) {
      var v = Math.round(Number(c && c[f.k]));
      if (!isFinite(v)) v = BUILTIN[0].cfg[f.k];
      out[f.k] = Math.max(f.min, Math.min(f.max, v));
    });
    return out;
  }

  // ===== 표기 =====
  function clock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function words(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    if (!m) return s + '초';
    return m + '분' + (s ? ' ' + s + '초' : '');
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  // ===== 구간 목록 만들기 =====
  function buildSteps(c) {
    var steps = [];
    if (c.prep > 0) steps.push({ type: 'prep', dur: c.prep, set: 1, round: 0 });
    for (var s = 1; s <= c.sets; s++) {
      for (var r = 1; r <= c.rounds; r++) {
        steps.push({ type: 'work', dur: c.work, set: s, round: r });
        if (r < c.rounds && c.rest > 0) steps.push({ type: 'rest', dur: c.rest, set: s, round: r });
      }
      if (s < c.sets && c.setRest > 0) steps.push({ type: 'setrest', dur: c.setRest, set: s, round: c.rounds });
    }
    if (c.cool > 0) steps.push({ type: 'cool', dur: c.cool, set: c.sets, round: c.rounds });
    return steps;
  }
  function totalOf(steps) { return steps.reduce(function (a, s) { return a + s.dur; }, 0); }

  function drawLine(el, steps) {
    el.className = 'timeline' + (steps.length <= 60 ? ' gap' : '');
    el.innerHTML = steps.map(function (s) {
      return '<div class="seg ' + s.type + '" style="flex-grow:' + s.dur + '"></div>';
    }).join('');
  }

  function sameCfg(a, b) {
    return FIELDS.every(function (f) {
      if (f.k === 'setRest' && a.sets === 1 && b.sets === 1) return true;
      return a[f.k] === b[f.k];
    });
  }
  function currentName() {
    var all = BUILTIN.concat(myPresets);
    for (var i = 0; i < all.length; i++) if (sameCfg(all[i].cfg, cfg)) return all[i].name;
    return '직접 설정';
  }

  // ===== 설정 화면 그리기 =====
  function renderRows() {
    $('rows').innerHTML = FIELDS.map(function (f) {
      return '<div class="row" data-k="' + f.k + '">' +
        '<div class="row-label"><span class="dot"' + (f.phase ? ' style="background:var(--' + f.phase + ')"' : '') + '></span>' + f.label + '</div>' +
        '<div class="stepper">' +
          '<button type="button" class="step-btn" data-d="-1" aria-label="' + f.label + ' 줄이기">−</button>' +
          '<div class="step-val" id="val-' + f.k + '"></div>' +
          '<button type="button" class="step-btn" data-d="1" aria-label="' + f.label + ' 늘리기">+</button>' +
        '</div></div>';
    }).join('');
  }

  function renderSetup() {
    FIELDS.forEach(function (f) {
      var el = $('val-' + f.k), v = cfg[f.k];
      var off = f.time && v === 0;
      el.textContent = off ? '없음' : (f.time ? clock(v) : v + f.unit);
      el.className = 'step-val' + (off ? ' off' : '');
    });
    document.querySelector('.row[data-k="setRest"]').hidden = cfg.sets < 2;

    var steps = buildSteps(cfg);
    $('planTotal').textContent = clock(totalOf(steps));
    $('planSub').textContent = '운동 ' + words(cfg.work * cfg.rounds * cfg.sets) + ' · ' +
      (cfg.sets > 1 ? cfg.sets + '세트 × ' : '') + cfg.rounds + '라운드';
    drawLine($('planLine'), steps);

    var name = currentName();
    $('presets').innerHTML = BUILTIN.concat(myPresets).map(function (p, i) {
      var mine = i >= BUILTIN.length;
      return '<span class="chip' + (p.name === name && sameCfg(p.cfg, cfg) ? ' on' : '') + '">' +
        '<button type="button" data-i="' + i + '">' + esc(p.name) + '</button>' +
        (mine ? '<button type="button" class="del" data-del="' + (i - BUILTIN.length) + '" aria-label="' + esc(p.name) + ' 삭제">✕</button>' : '') +
        '</span>';
    }).join('');

    $('soundBtn').textContent = soundOn ? '소리 켜짐' : '소리 꺼짐';
    $('soundBtn').setAttribute('aria-pressed', String(soundOn));

    $('log').innerHTML = log.slice(0, 7).map(function (r) {
      var d = new Date(r.at);
      return '<li><span><span class="when">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span> ' +
        esc(r.name) + (r.early ? ' (중간 종료)' : '') + '</span>' +
        '<span class="num">' + clock(r.total) + ' · ' + r.rounds + '라운드</span></li>';
    }).join('');
    $('logEmpty').hidden = log.length > 0;
  }

  function adjust(k, dir) {
    var f = FIELDS.filter(function (x) { return x.k === k; })[0];
    var step = f.time ? 5 : 1;
    cfg[k] = Math.max(f.min, Math.min(f.max, cfg[k] + dir * step));
    save('cfg', cfg);
    renderSetup();
  }

  // 길게 누르면 연속 조절
  var holdTimer = null, holdRepeat = null, held = false;
  function stopHold() { clearTimeout(holdTimer); clearInterval(holdRepeat); holdTimer = holdRepeat = null; }
  $('rows').addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.step-btn'); if (!b) return;
    var k = b.closest('.row').dataset.k, d = Number(b.dataset.d);
    held = false;
    stopHold();
    holdTimer = setTimeout(function () {
      held = true;
      holdRepeat = setInterval(function () { adjust(k, d); }, 70);
    }, 400);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { $('rows').addEventListener(t, stopHold); });
  $('rows').addEventListener('contextmenu', function (e) { if (e.target.closest('.step-btn')) e.preventDefault(); });
  $('rows').addEventListener('click', function (e) {
    var b = e.target.closest('.step-btn'); if (!b) return;
    if (held) { held = false; return; }
    adjust(b.closest('.row').dataset.k, Number(b.dataset.d));
  });

  $('presets').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.del !== undefined) {
      myPresets.splice(Number(b.dataset.del), 1);
      save('presets', myPresets);
    } else {
      cfg = sanitize(BUILTIN.concat(myPresets)[Number(b.dataset.i)].cfg);
      save('cfg', cfg);
    }
    renderSetup();
  });

  $('saveForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('presetName');
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    myPresets = myPresets.filter(function (p) { return p.name !== name; });
    myPresets.push({ name: name, cfg: sanitize(cfg) });
    if (myPresets.length > 8) myPresets.shift();
    save('presets', myPresets);
    input.value = '';
    input.blur();
    renderSetup();
  });

  $('soundBtn').addEventListener('click', function () {
    soundOn = !soundOn;
    save('sound', soundOn);
    if (soundOn) { initAudio(); tone(880, 0, 0.12, 0.3); }
    renderSetup();
  });

  // ===== 소리 · 진동 =====
  var audioCtx = null;
  function initAudio() {
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function tone(freq, delay, dur, vol, type) {
    if (!soundOn || !audioCtx) return;
    try {
      var t = audioCtx.currentTime + delay;
      var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

  function cueTick() { tone(700, 0, 0.14, 0.35, 'square'); }
  function cueStart(type) {
    if (type === 'work') { tone(990, 0, 0.18, 0.5); tone(1320, 0.18, 0.4, 0.5); buzz([120, 60, 120]); }
    else if (type === 'prep') { tone(660, 0, 0.2, 0.4); }
    else { tone(520, 0, 0.5, 0.45); buzz(250); }
  }
  function cueFinish() {
    [784, 988, 1175, 1568].forEach(function (f, i) { tone(f, i * 0.16, i === 3 ? 0.6 : 0.16, 0.5); });
    buzz([200, 100, 200, 100, 400]);
  }

  // ===== 화면 꺼짐 방지 =====
  var wakeLock = null;
  function keepAwake() {
    if (!navigator.wakeLock || wakeLock) return;
    try {
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  function letSleep() { if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; } }

  // ===== 타이머 =====
  // 남은 시간은 시각(ms) 기준으로 계산해서, 화면이 잠깐 멈춰도 밀리지 않는다.
  var run = null;
  var loopId = null;

  function show(view) {
    ['Setup', 'Run', 'Done'].forEach(function (v) { $('view' + v).hidden = v.toLowerCase() !== view; });
    document.body.dataset.view = view;
    if (view !== 'run') delete document.body.dataset.phase;
    window.scrollTo(0, 0);
  }

  function startWorkout() {
    initAudio();
    var steps = buildSteps(cfg);
    run = {
      steps: steps, name: currentName(),
      idx: 0, endsAt: 0, credited: 0, paused: false, pausedLeft: 0,
      total: 0, work: 0, rounds: 0, lastSec: -1
    };
    drawLine($('runLine'), steps);
    show('run');
    keepAwake();
    enter(0, Date.now());
    clearInterval(loopId);
    loopId = setInterval(tick, 100);
    tick();
  }

  function enter(idx, now) {
    run.idx = idx;
    run.endsAt = now + run.steps[idx].dur * 1000;
    run.credited = now;
    run.lastSec = -1;
    cueStart(run.steps[idx].type);
    renderStep();
  }

  function credit(until) {
    var dt = Math.max(0, until - run.credited) / 1000;
    run.total += dt;
    if (run.steps[run.idx].type === 'work') run.work += dt;
    run.credited = until;
  }

  function tick() {
    if (!run || run.paused) return;
    var now = Date.now();
    while (now >= run.endsAt) {
      var end = run.endsAt;
      credit(end);
      if (run.steps[run.idx].type === 'work') run.rounds += 1;
      if (run.idx + 1 >= run.steps.length) { finish(false); return; }
      enter(run.idx + 1, end);
    }
    credit(now);
    renderClock(now);
  }

  function renderStep() {
    var s = run.steps[run.idx], n = run.steps[run.idx + 1];
    document.body.dataset.phase = s.type;
    $('phaseName').textContent = PHASE_NAME[s.type];
    var pos = [];
    if (cfg.sets > 1) pos.push('세트 ' + s.set + '/' + cfg.sets);
    if (s.type === 'work' || s.type === 'rest') pos.push('라운드 ' + s.round + '/' + cfg.rounds);
    $('runPos').textContent = pos.join(' · ') || ' ';
    $('runNext').textContent = n ? '다음 ' + PHASE_NAME[n.type] + ' ' + words(n.dur) : '마지막 구간';
    var segs = $('runLine').children;
    for (var i = 0; i < segs.length; i++) {
      segs[i].className = 'seg' + (i < run.idx ? ' done' : i === run.idx ? ' now' : '');
    }
  }

  function renderClock(now) {
    var s = run.steps[run.idx];
    var leftMs = run.paused ? run.pausedLeft : Math.max(0, run.endsAt - now);
    var sec = Math.ceil(leftMs / 1000);
    if (sec !== run.lastSec) {
      if (!run.paused && run.lastSec !== -1 && sec >= 1 && sec <= 3 && s.dur > 3) cueTick();
      run.lastSec = sec;
      var el = $('clock');
      el.textContent = sec >= 60 ? clock(sec) : sec;
      el.className = 'clock' + (sec >= 60 ? ' long' : '');
      var rest = 0;
      for (var i = run.idx + 1; i < run.steps.length; i++) rest += run.steps[i].dur;
      $('runLeft').textContent = '전체 남은 시간 ' + clock(rest + sec);
    }
    $('ring').style.strokeDashoffset = (879.65 * (1 - leftMs / (s.dur * 1000))).toFixed(1);
  }

  function setPaused(p) {
    if (!run || run.paused === p) return;
    var now = Date.now();
    if (p) { credit(now); run.pausedLeft = Math.max(0, run.endsAt - now); letSleep(); }
    else { run.endsAt = now + run.pausedLeft; run.credited = now; keepAwake(); initAudio(); }
    run.paused = p;
    $('pauseBtn').textContent = p ? '계속' : '일시정지';
    $('stopBtn').hidden = !p;
    $('ringWrap').classList.toggle('paused', p);
  }

  function jump(dir) {
    if (!run) return;
    var now = Date.now();
    var wasPaused = run.paused;
    if (!wasPaused) credit(now);
    var s = run.steps[run.idx];
    var leftMs = wasPaused ? run.pausedLeft : run.endsAt - now;
    var target = run.idx + dir;
    // 구간이 2초 넘게 지났으면 '이전'은 현재 구간을 처음부터 다시 시작
    if (dir < 0 && (s.dur * 1000 - leftMs > 2000 || run.idx === 0)) target = run.idx;
    if (target >= run.steps.length) { finish(true); return; }
    enter(target, now);
    if (wasPaused) run.pausedLeft = run.steps[target].dur * 1000;
    renderClock(now);
  }

  function finish(early) {
    if (!run) return;
    if (!run.paused) credit(Math.min(Date.now(), run.endsAt));
    clearInterval(loopId); loopId = null;
    letSleep();
    var r = run; run = null;
    $('pauseBtn').textContent = '일시정지';
    $('stopBtn').hidden = true;
    $('ringWrap').classList.remove('paused');

    if (r.total < 1) { show('setup'); renderSetup(); return; }
    cueFinish();
    var total = Math.round(r.total), work = Math.round(r.work);
    log.unshift({ at: Date.now(), name: r.name, total: total, work: work, rounds: r.rounds, early: early });
    log = log.slice(0, 30);
    save('log', log);

    $('doneTitle').textContent = early ? '여기까지 했습니다' : r.name + ' 완료';
    $('doneTotal').textContent = clock(total);
    $('doneWork').textContent = clock(work);
    $('doneRounds').textContent = r.rounds;
    show('done');
  }

  $('startBtn').addEventListener('click', startWorkout);
  $('againBtn').addEventListener('click', startWorkout);
  $('backBtn').addEventListener('click', function () { show('setup'); renderSetup(); });
  $('pauseBtn').addEventListener('click', function () { if (run) setPaused(!run.paused); });
  $('prevBtn').addEventListener('click', function () { jump(-1); });
  $('nextBtn').addEventListener('click', function () { jump(1); });
  $('stopBtn').addEventListener('click', function () { finish(true); });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && run && !run.paused) { keepAwake(); initAudio(); tick(); }
  });
  document.addEventListener('keydown', function (e) {
    if (!run || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); setPaused(!run.paused); }
    else if (e.code === 'ArrowRight') jump(1);
    else if (e.code === 'ArrowLeft') jump(-1);
  });

  renderRows();
  renderSetup();
})();
</script>
</body>
</html>
